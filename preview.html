<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageSnap preview</title>
<style>
  :root { --bg:#f3f3f6; --fg:#1b1b1f; --bar:#fff; --line:#dcdce3; --accent:#3b6cf6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121216; --fg:#f0f0f4; --bar:#1c1c21; --line:#33333b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  header { position:sticky; top:0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--bar); border-bottom:1px solid var(--line); }
  header span { flex:1; min-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:none; color:inherit; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  main { padding:16px; }
  img { display:block; max-width:100%; height:auto; margin:0 auto; box-shadow:0 2px 12px rgba(0,0,0,.25); background:#fff; }
</style>
</head>
<body>
  <header>
    <span id="info">Loading...</span>
    <button id="copy">Copy</button>
    <button class="primary" id="save">Save</button>
  </header>
  <main><img id="img" alt="Captured page"></main>
  <script src="preview.js"></script>
</body>
</html>
