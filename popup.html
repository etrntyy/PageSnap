<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageSnap</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#6b6b76; --accent:#3b6cf6; --line:#e2e2e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c21; --fg:#f0f0f4; --muted:#9a9aa6; --line:#33333b; } }
  body { margin:0; width:260px; max-width:100%; padding:14px; box-sizing:border-box; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  h1 { font-size:15px; margin:0 0 12px; }
  button { width:100%; padding:11px; margin-bottom:8px; border-radius:10px; border:1px solid var(--line); background:none; color:inherit; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.6; cursor:default; }
  label { display:flex; align-items:center; justify-content:space-between; color:var(--muted); margin-top:4px; }
  select { font:inherit; padding:4px 6px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  #status { min-height:18px; margin:8px 0 0; font-size:12px; color:var(--muted); }
  #status.err { color:#d33; }
</style>
</head>
<body>
  <h1>PageSnap</h1>
  <button class="primary" id="full">Capture full page</button>
  <button id="visible">Capture visible area</button>
  <label>Format
    <select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option></select>
  </label>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
